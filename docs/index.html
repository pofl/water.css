<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

        <title>Water.css</title>

        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#202b38" media="(prefers-color-scheme: dark)">

        <link rel="stylesheet" href="../dist/water.min.css">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <div class="header-container">
                <h1>
                    <img src="../assets/icon.svg" alt="Water.css icon" width="24" height="24">
                    Water.css
                </h1>
                <p>Forked by <a href="https://github.com/hhiruko/water.css" target="_blank"><code>hhiruko</code></a>.</p>
            </div>
        </header>
        <main role="main">
            <section id="how-to-use">
                <h2>How to use</h2>
                <p>Add <code>theme-dark</code> or <code>theme-light</code> class to your <code>&lt;body&gt;</code>, or leave it empty for automatic theme detection.</p>
                <form id="theme-form">
                    <input type="radio" value="auto" checked name="theme" id="theme-auto" />
                    <label for="theme-auto">Automatic 🌙 / ☀</label>

                    <input type="radio" value="dark" name="theme" id="theme-dark" />
                    <label for="theme-dark">Dark theme 🌙</label>

                    <input type="radio" value="light" name="theme" id="theme-light" />
                    <label for="theme-light">Light theme ☀</label>
                </form>
                <pre><code id="theme-example-code">&lt;body&gt;<br>    ...<br>&lt;/body&gt;</code></pre>
            </section>

            <section id="select-element">
                <h2>Select element</h2>
                <form>
                    <label for="favorite-doe">Favorite Doe</label>
                    <select name="favorite-doe" id="favorite-doe">
                        <option value="john">John Doe</option>
                        <option value="jane">Jane Doe</option>
                    </select>
                </form>
            </section>

        </main>

        <footer>
            <a href="#">Back to top ⬆</a>
        </footer>

        <script src="index.js"></script>
    </body>
</html>
